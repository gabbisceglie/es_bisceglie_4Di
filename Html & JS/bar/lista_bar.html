<html>
    <head>
        <title>Lista Ordini</title>
        
        <script Language="JavaScript">

            var Ordini  = new Array();

            function Ordine (myProdotto, myPrezzoUnitario, myQuantita, myNote) {
                this.Prodotto = myProdotto;
                this.PrezzoUnitario = myPrezzoUnitario;
                this.Quantita = myQuantita; 
                this.Note = myNote;
                }

                function CaricaDati() {

                Ordini[0] = new Ordine ("Panino al prosciutto", 2, 0);
                Ordini[1] = new Ordine ("Panino al salame", 2, 0);
                Ordini[2] = new Ordine ("Panino al tonno", 3, 0);
                Ordini[3] = new Ordine ("Cornetto pan di stelle", 1.2, 0);
                Ordini[4] = new Ordine ("Cornetto marmellata", 1.0, 0);
                Ordini[5] = new Ordine ("Cornetto all'olio di Stragapede", 6.7, 0);
                }

            function Inizializza() {
                CaricaDati();
                ScriviTabella();
                document.getElementById("totale_lista").textContent = CalcolaTotale();
                }

            function ScriviTabella() {

                var i = 0;
                var Tabella = document.getElementById("elenco");

                for (i=0; i<Ordini.length; i++) {
                    var riga = Tabella.insertRow(i+1);
                    var cell1 = riga.insertCell(0);
                    var cell2 = riga.insertCell(1);
                    var cell3 = riga.insertCell(2);
                    var cell4 = riga.insertCell(3);
                    
                    cell1.innerHTML= Ordini[i].Prodotto;
                    cell2.innerHTML= Ordini[i].PrezzoUnitario;
                    cell3.innerHTML= Ordini[i].Quantita;
                    cell3.innerHTML= "<input type='number' id='qta_" + i +"' value='0' oninput='AggiornaQuantita(" + i +")'>"
                    cell4.innerHTML = "<input type='Number' ID='totale_" + i + "' readonly>" //aggiunto il readonly 
                    var cell5 = riga.insertCell(4);
                    cell5.innerHTML = "<input type='text' ID='note_" + i + "' onchange='AggiornaNote(" + i +")'>";
                    }
                }

            function AggiornaNote(iRigo) {
                var note = document.getElementById("note_"+iRigo).value;
                Ordini[iRigo].Note = note;
            }

            function AggiornaQuantita(iRigo) {
                var qta=0;
                var prezzo = 0;
                var totale = 0;
                
                //INPUT
                qta = document.getElementById("qta_"+iRigo).value;
                
                prezzo = Ordini[iRigo].PrezzoUnitario;
                
                //ELABORAZIONE
                if (qta >= 0) {
                    totale = qta*prezzo;
                    totale = totale.toFixed(2);
                    } else {
                    qta = 0;
                    }
                
                //OUTPUT
                document.getElementById("totale_"+iRigo).value = totale;
                document.getElementById("qta_"+iRigo).value = qta;
                
                Ordini[iRigo].Quantita = qta;
                document.getElementById("totale_lista").textContent = CalcolaTotale();
                }

            function CalcolaTotale() {
                var totale = 0;

                for (var i = 0; i < Ordini.length; i++) {
                    totale += Number(Ordini[i].Quantita) * Ordini[i].PrezzoUnitario;
                }

                return totale.toFixed(2);
            }



            </script>
        </head>
    <body onload="Inizializza()">

    <table border="1" ID="elenco">
    <tr><td>PRODOTTO</td><td>Prezzo</td><td>Quantità</td><td>TOTALE</td><td>NOTE</td></tr>
    </table>

    <br>

    <table border="2" align="center">
        <tr>
            <td>Totale:</td>
            <td width="50" id="totale_lista"></td>
        </tr>
    </table>

    </body>
</html>
