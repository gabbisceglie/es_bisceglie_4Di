<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Ricevuta fiscale</title>
    <script>
        const prodotti = [
            { nome: "Panino al prosciutto", prezzo: 2 },
            { nome: "Panino al salame", prezzo: 2 },
            { nome: "Panino al tonno", prezzo: 3 },
            { nome: "Cornetto pan di stelle", prezzo: 1.2 },
            { nome: "Cornetto marmellata", prezzo: 1 },
            { nome: "Cornetto all'olio di Stragapede", prezzo: 6.7 }
        ];

        function formatoEuro(importo) {
            return "€ " + importo.toFixed(2).replace(".", ",");
        }

        function descrizioneVariazione(variazione) {
            if (variazione > 0) {
                return "+ " + formatoEuro(variazione);
            }

            if (variazione < 0) {
                return "- " + formatoEuro(Math.abs(variazione));
            }

            return "nessuna variazione";
        }

        function caricaScontrino() {
            const quantitaSalvate = JSON.parse(
                localStorage.getItem("quantitaScontrino") || "[]"
            );
            const variantiSalvate = JSON.parse(
                localStorage.getItem("variantiScontrino") || "[]"
            );
            const righe = document.getElementById("righe-ordine");
            let totale = 0;

            prodotti.forEach(function (prodotto, indice) {
                const quantita = Number(quantitaSalvate[indice]) || 0;

                if (quantita <= 0) {
                    return;
                }

                const varianteSalvata = variantiSalvate[indice];
                const variante = varianteSalvata && typeof varianteSalvata === "object"
                    ? varianteSalvata
                    : {
                        nome: "Classica",
                        variazione: 0
                    };
                const variazione = Number(variante.variazione);
                const variazioneSicura = Number.isFinite(variazione) ? variazione : 0;
                const nomeVariante = variante.nome || "Classica";
                const prezzoUnitario = prodotto.prezzo + variazioneSicura;
                const totaleRiga = quantita * prezzoUnitario;
                totale += totaleRiga;

                const riga = document.createElement("tr");
                const descrizione = document.createElement("td");
                descrizione.textContent = prodotto.nome;

                const dettaglioVariante = document.createElement("small");
                dettaglioVariante.textContent =
                    "Variante: " + nomeVariante +
                    " (" + descrizioneVariazione(variazioneSicura) + ")";
                descrizione.appendChild(document.createElement("br"));
                descrizione.appendChild(dettaglioVariante);

                const quantitaCella = document.createElement("td");
                quantitaCella.textContent = quantita;
                quantitaCella.align = "right";

                const prezzoCella = document.createElement("td");
                prezzoCella.textContent = formatoEuro(prezzoUnitario);
                prezzoCella.align = "right";

                const totaleCella = document.createElement("td");
                totaleCella.textContent = formatoEuro(totaleRiga);
                totaleCella.align = "right";

                riga.appendChild(descrizione);
                riga.appendChild(quantitaCella);
                riga.appendChild(prezzoCella);
                riga.appendChild(totaleCella);
                righe.appendChild(riga);
            });

            const imponibile = totale / 1.1;
            document.getElementById("imponibile").textContent = formatoEuro(imponibile);
            document.getElementById("iva").textContent = formatoEuro(totale - imponibile);
            document.getElementById("totale").textContent = formatoEuro(totale);
        }
    </script>
</head>
<body onload="caricaScontrino()">
    <table border="1" cellpadding="6" cellspacing="0" width="400" align="center">
        <tr>
            <th colspan="4">
                <h2>IL BAR DEGLI AMICI</h2>
                Ricevuta fiscale<br>
                Data: 14/10/2026
            </th>
        </tr>
        <tr>
            <th>Descrizione</th>
            <th>Q.tà</th>
            <th>Prezzo</th>
            <th>Totale</th>
        </tr>
        <tbody id="righe-ordine"></tbody>
        <tr>
            <td colspan="3" align="right">Imponibile</td>
            <td id="imponibile" align="right">€ 0,00</td>
        </tr>
        <tr>
            <td colspan="3" align="right">Di cui IVA</td>
            <td id="iva" align="right">€ 0,00</td>
        </tr>
        <tr>
            <th colspan="3" align="right">TOTALE</th>
            <th id="totale" align="right">€ 0,00</th>
        </tr>
        <tr>
            <td colspan="4" align="center">Grazie e arrivederci!</td>
        </tr>
    </table>

    <p align="center"><button type="button" onclick="window.print()">Stampa</button></p>

</body>
</html>
