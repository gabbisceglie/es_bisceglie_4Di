<html>
    <head>
        <script language="javascript">

            function numero(num) {
                calc.operazioni.value += num;
            }

            function calcola() {
                calc.risultato.value = eval(calc.operazioni.value);
            }


        </script>
        <body>


<form name="calc">

    <!-- CASELLE DI TESTO -->
    <input type="text" name="operazioni">
    
    <input type="text" name="risultato" readonly>

    <br>

    <!-- Pulsanti Calcolatrice -->

    <input type="button" value="7" onclick="numero(7)">
    <input type="button" value="8" onclick="numero(8)">
    <input type="button" value="9" onclick="numero(9)">
    <input type="button" value="+" onclick="calc.operazioni.value+='+'">
    <input type="button" value="C" onclick="calc.operazioni.value=''">
    <br>
    <input type="button" value="4" onclick="numero(4)">
    <input type="button" value="5" onclick="numero(5)">
    <input type="button" value="6" onclick="numero(6)">
    <input type="button" value="-" onclick="calc.operazioni.value+='-'" style="width: 22px">
    <br>
    <input type="button" value="1" onclick="numero(1)">
    <input type="button" value="2" onclick="numero(2)">
    <input type="button" value="3" onclick="numero(3)">
    <input type="button" value="*" onclick="calc.operazioni.value+='*'" style="width: 22px">
    <br>
    <input type="button" value="0" onclick="numero(0)" style="width: 51px">
    <input type="button" value="." onclick="numero('.')" style="width: 23px">
    <input type="button" value="/" onclick="calc.operazioni.value+='/'" style="width: 22px">
    <br>
    <input type="button" value="=" onclick="calcola()" style="width: 104px">

</form>




        </body>
    </head>
</html>
